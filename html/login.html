<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đăng nhập / Đăng ký – Tắc Đường AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" crossorigin href="../css/main.css" />
  </head>
  <body class="auth-page">
    <!-- ===== THANH ĐẦU TRANG ===== -->
    <header class="site-header">
      <a class="logo" href="main.html">Tắc Đường <span>AI</span></a>
      <nav class="menu">
        <a href="main.html">Trang chủ</a>
        <a href="Map.html">Bản đồ</a>
        <a href="login.html" aria-current="page">Đăng nhập</a>
      </nav>
    </header>

    <main class="auth-main">
      <div class="auth-card card">
        <!-- Tab chuyển giữa Đăng nhập / Đăng ký -->
        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tab-login">
            Đăng nhập
          </button>
          <button type="button" class="auth-tab" id="tab-register">
            Đăng ký
          </button>
        </div>

        <!-- ===== FORM ĐĂNG NHẬP ===== -->
        <form id="login-form" novalidate>
          <div class="form-field">
            <label for="login-email">Email</label>
            <input
              id="login-email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="login-password">Mật khẩu</label>
            <input
              id="login-password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>
          <button class="btn auth-submit" type="submit">Đăng nhập</button>
          <p
            class="form-message"
            id="login-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <!-- ===== FORM ĐĂNG KÝ ===== -->
        <form id="register-form" hidden novalidate>
          <div class="form-field">
            <label for="reg-fullname">Họ và tên</label>
            <input
              id="reg-fullname"
              type="text"
              autocomplete="name"
              placeholder="Nguyễn Văn A"
              required
            />
          </div>
          <div class="form-field">
            <label for="reg-email">Email</label>
            <input
              id="reg-email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="reg-password"
              >Mật khẩu <small>(tối thiểu 6 ký tự)</small></label
            >
            <input
              id="reg-password"
              type="password"
              autocomplete="new-password"
              placeholder="••••••••"
              minlength="6"
              required
            />
          </div>
          <button class="btn auth-submit" type="submit">Tạo tài khoản</button>
          <p
            class="form-message"
            id="register-message"
            role="status"
            aria-live="polite"
          ></p>
        </form>

        <!-- ===== THÔNG TIN TÀI KHOẢN ĐÃ ĐĂNG NHẬP ===== -->
        <div id="me-panel" hidden>
          <h2 class="auth-welcome">
            Xin chào, <span id="me-name">--</span> 👋
          </h2>
          <dl class="me-list">
            <dt>Email</dt>
            <dd id="me-email">--</dd>
            <dt>Vai trò</dt>
            <dd id="me-role">--</dd>
            <dt>Ngày tạo</dt>
            <dd id="me-created">--</dd>
          </dl>
          <div class="auth-actions">
            <a
              class="btn btn-outline"
              href="admin.html"
              id="me-admin-link"
              hidden
              >Vào trang quản trị</a
            >
            <button class="btn-danger" id="logout-btn" type="button">
              Đăng xuất
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>Tắc Đường AI – Bài tập thực tập.</p>
    </footer>

    <script type="module" crossorigin src="../js/login.js"></script>
  </body>
</html>
